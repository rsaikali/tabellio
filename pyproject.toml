[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabellio"
version = "0.0.1"
description = "Image of a civil-registry / parish record -> validated structured JSON. BYOK, provider-agnostic, no embedded model, no storage."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Roland Saikali" }]
keywords = ["genealogy", "HTR", "OCR", "vlm", "civil-registry", "parish-register", "transcription"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pydantic>=2.7",
    "loguru>=0.7",
]

[project.urls]
Homepage = "https://github.com/rsaikali/tabellio"
Repository = "https://github.com/rsaikali/tabellio"
Issues = "https://github.com/rsaikali/tabellio/issues"

[project.optional-dependencies]
gemini = ["google-genai>=0.3"]
openai = ["openai>=1.30"]
nim = ["openai>=1.30"]
anthropic = ["anthropic>=0.34"]
ollama = ["ollama>=0.3"]
all = ["google-genai>=0.3", "openai>=1.30", "anthropic>=0.34", "ollama>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tabellio"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
